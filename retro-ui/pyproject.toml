[project]
name = "retroui"
version = "0.0.1"
description = "TUI-looking desktop GUI library with real pixel graphics (pygame-ce backend)"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retroui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

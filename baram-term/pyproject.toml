[project]
name = "baram-term"
version = "0.1.0"
description = "Firmware CLI serial terminal with a retro TUI look"
requires-python = ">=3.10"
dependencies = [
    "retro-ui",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
baram-term = "baram_term.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baram_term"]

[tool.uv.sources]
retro-ui = { path = "../retro-ui", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
